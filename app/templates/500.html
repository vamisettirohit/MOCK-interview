{% extends "base.html" %}

{% block title %}500 Server Error — Mock Interview AI{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 6rem 1rem 8rem;">
  <div style="font-size: 4rem; font-weight: 800; font-family: var(--font-heading); color: var(--danger); margin-bottom: 0.5rem;">500</div>
  <h1 style="font-size: 2rem; margin-bottom: 1rem;">Internal Server Error</h1>
  <p style="max-width: 480px; margin: 0 auto 2rem; color: var(--text-secondary);">
    Something went wrong on our end while processing your request. Please try again or return to the dashboard.
  </p>
  <a href="{{ url_for('dashboard.index') if current_user else url_for('main.index') }}" class="btn btn-primary">Back to Safety</a>
</div>
{% endblock %}
